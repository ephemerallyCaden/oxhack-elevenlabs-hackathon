name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decides whether there is anything to test. Until .claude/auto-check.json has commands,
  # `check` shows as "skipped" (grey): honest that nothing ran, without a red failure.
  config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.read.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          configured=$(jq '((.static // []) + (.dynamic // []) | length) > 0' .claude/auto-check.json)
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" != "true" ]; then
            echo "::notice::No checks configured yet. Add commands to .claude/auto-check.json and the check job will run."
          fi

  check:
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Same runner the auto-check plugin uses (static + dynamic from .claude/auto-check.json).
      # No tester here: CI only runs checks. --ci also runs the `setup` commands first.
      - run: node plugins/auto-check/scripts/check.mjs --ci
