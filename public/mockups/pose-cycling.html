<!DOCTYPE html>

<head>

<title>Task 3 — Pose cycling · 5 variations</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #050507; color: #ccc; font-family: system-ui, sans-serif; }
  body { display: flex; overflow: hidden; }
  #fit { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stageBox { width: 960px; height: 540px; flex: none; }
  #panel { width: 360px; flex: none; height: 100%; overflow-y: auto; background: #0d0d12; border-left: 1px solid #222; padding: 14px; font-size: 12px; }

  .stage { position: relative; width: 960px; height: 540px; overflow: hidden; background: #000; }
  .fill { position: absolute; inset: 0; }
  .cam { position: absolute; inset: 0; transform-origin: center center; }
  .plane { position: absolute; inset: 0; }
  .plane-img { position: absolute; display: block; max-width: none; pointer-events: none; filter: saturate(0.3) contrast(1.25) brightness(0.68); }
  .plane[data-plane="far"] .plane-img, .plane[data-plane="mid"] .plane-img {
    -webkit-mask-image: linear-gradient(90deg, transparent 0, transparent 176px, #000 303px, #000 1157px, transparent 1284px);
            mask-image: linear-gradient(90deg, transparent 0, transparent 176px, #000 303px, #000 1157px, transparent 1284px); }
  .fx-speed { pointer-events: none; z-index: 20; background: repeating-conic-gradient(from 0deg at 50% 45%, transparent 0deg 2.8deg, rgba(0,0,0,.04) 2.8deg 3deg); }
  .fx-halftone { pointer-events: none; z-index: 21; background-image: radial-gradient(circle, rgba(0,0,0,.15) 1px, transparent 1px); background-size: 4px 4px; mix-blend-mode: multiply; }
  .fx-ink { pointer-events: none; z-index: 22; background: radial-gradient(ellipse 80% 80% at 50% 45%, transparent 40%, rgba(0,0,0,.6) 100%); }
  .ink-bottom .fx-ink { background: linear-gradient(0deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.2) 25%, transparent 45%), radial-gradient(ellipse 80% 80% at 50% 45%, transparent 40%, rgba(0,0,0,.6) 100%); }
  /* lecterns in front of the lawyers (ride the desks plane, so they parallax with them) */
  .pedestal { position: absolute; z-index: 8; pointer-events: none; transform-origin: 50% 0; }
  .ped-noir .pedestal { filter: saturate(0.3) contrast(1.25) brightness(0.68); }
  .fx-scan { pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.06) 2px 3px); }
  .fx-vig { pointer-events: none; z-index: 51; border: 4px solid #000; box-shadow: inset 0 0 80px rgba(0,0,0,.5), inset 0 0 20px rgba(0,0,0,.3); }

  /* ── pose characters: head BEHIND the suit, so the neck emerges from the collar ── */
  .pc { position: absolute; transform-origin: 50% 100%; }
  .pc-bob { position: absolute; inset: 0; }
  .talking .pc-bob { animation: talkBob .4s ease-in-out infinite; }
  @keyframes talkBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .pc-head { position: absolute; width: 0; height: 0; z-index: 1; transform-origin: 0 0; }   /* the marker point */
  .pc-head-in { position: absolute; left: 0; top: 0; }
  .pc-head-in img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pc-pose { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
  .pc-pose.fading { z-index: 3; transition: opacity 60ms linear; }
  .pc-flash { position: absolute; inset: 0; z-index: 4; background: #fff; opacity: 0; pointer-events: none;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  .pc .tag { position: absolute; z-index: 6; font: 9px monospace; color: #fff; background: rgba(0,0,0,.65); padding: 1px 4px; border-radius: 3px; white-space: nowrap; display: none; }
  .debug .pc .tag { display: block; }
  /* swap styles */
  .pc.pop { animation: pop 80ms ease-out; }
  @keyframes pop { 0% { transform: scale(1.06, 0.95); } 100% { transform: scale(1); } }

  /* ── Expression particles (ported from public/mockup-expressions.html) ──
     .pc-fx sits on the head point; --F = face unit (px), --m = 1 / -1 (mirrored for the defense).
     Each particle: --dx/--dy centre and --w size, in face units. */
  .pc-fx { position: absolute; width: 0; height: 0; z-index: 5; pointer-events: none; }
  .fxp { position: absolute; width: 0; height: 0; display: none; left: calc(var(--m) * var(--F) * var(--dx) * 1px); top: calc(var(--F) * var(--dy) * 1px); }
  .fxp > img { position: absolute; display: block; width: calc(var(--F) * var(--w) * 1px); left: calc(var(--F) * var(--w) * -0.5px); top: calc(var(--F) * var(--w) * -0.5px); }
  .x-confident .fxp.spark, .x-sweating .fxp.sweat, .x-angry .fxp.vein, .x-shocked .fxp.bang, .x-breakdown .fxp.crack { display: block; }

  /* confident: four sparkles, staggered */
  .fxp.spark img { animation: sparkle 1.5s ease-in-out var(--d) infinite; }
  @keyframes sparkle { 0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.6; } 50% { transform: scale(1.2) rotate(10deg); opacity: 1; } }

  /* sweating: three drops roll down + the head trembles */
  .fxp.sweat img { animation: sweatDrop 2s ease-in var(--d) infinite; opacity: 0; }
  @keyframes sweatDrop { 0% { transform: translateY(0); opacity: 0.9; } 80% { transform: translateY(calc(var(--F) * 0.85px)); opacity: 0.7; } 100% { transform: translateY(calc(var(--F) * 1px)); opacity: 0; } }
  .x-sweating .pc-head { animation: tremble 0.12s linear infinite; }
  @keyframes tremble { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }

  /* angry: three veins (bigger than the old mockup), brows slam down, red tint pulses */
  .fxp.vein img { animation: var(--anim) var(--t) ease-in-out infinite; }
  @keyframes veinBounce1 { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.25) translateY(-3px); } }
  @keyframes veinBounce2 { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.2) translateY(-4px); } }
  @keyframes veinBounce3 { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.3) translateY(-2px); } }
  .x-angry .pc-head-in > img { animation: angryTint 0.5s ease-in-out infinite; }
  @keyframes angryTint { 0%, 100% { filter: sepia(0.2) saturate(1.25) hue-rotate(-12deg); } 50% { filter: sepia(0.45) saturate(1.7) hue-rotate(-22deg) brightness(0.97); } }
  .pc-head-in img.brow { position: absolute; inset: auto; height: auto; z-index: 3; opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scaleX(var(--bs, 1)); }
  .x-angry .brow.on { animation: browSlam 0.15s ease-in forwards; }
  @keyframes browSlam { 0% { opacity: 0; transform: translate(-50%, -120%) scaleX(var(--bs, 1)); } 100% { opacity: 1; transform: translate(-50%, -50%) scaleX(var(--bs, 1)); } }

  /* shocked: "!" pops then bounces, white flash, head bounce */
  .fxp.bang img { animation: exclamationPop 0.4s cubic-bezier(.175,.885,.32,1.275) forwards, exclamationBounce 0.6s ease-in-out 0.5s infinite; }
  @keyframes exclamationPop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes exclamationBounce { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.15) translateY(-4px); } }
  .x-shocked .pc-head { animation: headShock .3s ease-out 1; }
  @keyframes headShock { 0% { transform: scale(1.15); } 100% { transform: scale(1); } }

  /* breakdown: six crack lines fan out from the head and flicker; face drains; body shakes */
  .fxp.crack { --len: 1.15; }
  .crack-slot { position: absolute; left: calc(var(--F) * -0.25px); top: 0; width: calc(var(--F) * 0.5px); height: calc(var(--F) * 1.7px); transform-origin: 50% 0; transform: rotate(var(--a));
    filter: invert(1) drop-shadow(0 0 1px #000) drop-shadow(0 0 2px rgba(0,0,0,.8)); }
  .crack-slot img { position: absolute; left: 0; top: calc(var(--F) * 0.42px); width: 100%; height: calc(var(--F) * var(--len) * 1px); opacity: 0;
    animation: crackReveal 0.6s ease-out var(--d) forwards, crackFlicker 0.3s step-end calc(var(--d) + 0.8s) infinite; }
  @keyframes crackReveal { 0% { clip-path: inset(0 0 100% 0); opacity: 0; } 30% { opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 1; } }
  @keyframes crackFlicker { 0%, 49.9% { transform: scaleX(1); } 50%, 100% { transform: scaleX(-1); } }
  .x-breakdown .pc-head-in > img { filter: saturate(0.3) brightness(0.8); transition: filter 1s ease; }
  .x-breakdown .pc-pose { animation: bdShake 0.2s steps(2) infinite; }
  @keyframes bdShake { 0%, 100% { transform: rotate(-1deg) translateX(0); } 50% { transform: rotate(-1deg) translateX(-2px); } }

  .no-textbox .textbox { display: none; }
  .textbox { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; z-index: 60; background: #08080e; border-top: 3px solid #2a3050; padding: 12px 24px; display: flex; flex-direction: column; justify-content: center; }
  .tb-name { font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: .2em; margin-bottom: 8px; }
  .tb-text { font-family: 'VT323', monospace; font-size: 22px; color: #e0e0e0; line-height: 1.3; }
  #phaseTag { position: absolute; right: 8px; top: 8px; z-index: 90; font: 10px monospace; color: #999; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 3px; }
  #standin { position: absolute; left: 8px; top: 8px; z-index: 90; font: 10px monospace; color: #f0b830; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 3px; }

  #panel h2 { font-size: 13px; color: #fff; margin: 12px 0 6px; }
  #panel h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { width: 110px; flex: none; color: #999; }
  .row input[type=range] { flex: 1; }
  .row output { width: 40px; text-align: right; color: #f0b830; font-family: monospace; }
  select, button { background: #16161d; color: #ddd; border: 1px solid #333; border-radius: 4px; padding: 5px 8px; font-size: 12px; cursor: pointer; }
  button.on { border-color: #f0b830; color: #f0b830; }
  .vars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .vars button { padding: 7px 0; font-weight: 700; }
  .desc { color: #777; font-size: 11px; margin: 4px 0; min-height: 30px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  .who { display: grid; grid-template-columns: 74px 1fr 52px; gap: 4px; align-items: center; margin: 3px 0; }
  .go { background: #a11; border-color: #f44; color: #fff; font-weight: 700; }
  #dbg { font: 10px/1.5 monospace; color: #8fd; background: #08080b; border: 1px solid #222; padding: 6px; white-space: pre; }
  textarea { width: 100%; height: 110px; background: #08080b; color: #8fd; border: 1px solid #222; font: 10px monospace; padding: 6px; }
</style>

<body>

<div id="fit"><div id="stageBox">

  </div>

  <h2>Pose editor · head rotation per animation</h2>
  <div class="row"><label>Pose</label><select id="edPose"></select></div>

  <div class="row"><label>Head rotation °</label><input type="range" id="edRot" min="-45" max="45" step="0.5"><output id="edRotOut"></output></div>
  <div id="edPreview" style="position:relative;width:332px;height:240px;margin:6px 0;background:radial-gradient(ellipse at 50% 40%,#2a2a36,#101016);border:1px solid #2a2a33;border-radius:4px;overflow:hidden"></div>
  <div id="edTable" style="font:10px/1.6 monospace;color:#8fd;background:#08080b;border:1px solid #222;padding:6px;white-space:pre"></div>
  <h2>Camera (whip)</h2>

  <h2>Look &amp; rhythm</h2>
  <div class="row"><label>Swap style</label><select id="swap"><option value="instant">Instant cut</option><option value="pop">Cut + pop</option><option value="flash">Cut + 1-frame flash</option><option value="smear">Cut + 1-frame smear</option><option value="fade">60ms crossfade</option></select></div>
  <div class="row"><label>Tick rhythm</label><select id="rhythm"><option value="uniform">Uniform</option><option value="clustered">Clustered bursts</option><option value="sentence">Sentence breaks</option></select></div>

  <div class="row"><label>Look</label><select id="pedLook"><option value="natural">Natural wood</option><option value="noir">Match room (desaturated)</option></select></div>
  <div class="row"><label>Bottom ink gradient</label><input type="checkbox" id="inkBottom"></div>
  <div class="row"><label>Textbox panel</label><input type="checkbox" id="tbPanel"></div>
  <div id="pedSliders"></div>

  <h2>Live state</h2>
  <div id="dbg"></div>

  <textarea id="out" readonly></textarea>
</div>

<script>
// ─── Scene constants (same as the build) ───
const KX = 0.978369, KY = 0.958622, OX = -45.18375, OY = 230.870625;
const SHOT = { witness: { S: 1.4, tx: 0.96, ty: -77.22 }, yes: { S: 2.2, tx: 208.32, ty: -100.44 }, no: { S: 2.2, tx: -206.4, ty: -100.44 }, judge: { S: 2.0, tx: 0, ty: -42.66 } };
const FACE = { prosecution: [223.7, 343.7], defense: [734.4, 343.7], judge: [480, 283] };   // today's face centres (stage px)
// The Judge stands behind the bench (it hides the cut-off robe). The lawyers get their own layer
// ABOVE every background segment (desks, carpet bands), then the pedestals above them; both carry
// the mid plane's parallax weight so they still move with the desks in the intro.
const RIDES = { far: ['judge'] };
/** Face anchor on stage; the lawyers can be raised/lowered as a pair (their pedestals follow). */
const faceAt = role => role === 'judge' ? FACE.judge : [FACE[role][0], FACE[role][1] + params.charY];
const MID_WEIGHT = 0.3;
const WHO = { prosecution: { name: 'PROSECUTION · YES', col: '#3b82f6' }, defense: { name: 'DEFENSE · NO', col: '#ef4444' }, judge: { name: 'THE JUDGE', col: '#a16207' } };
const LINES = {
  prosecution: 'Think about it. In five years I am writing this from Lisbon, working twenty hours a week. The top players earn more than any quant, and I am one of them. Why would I go back?',
  defense: 'Hold on. The median player takes home twelve thousand pounds a year. That is less than minimum wage, and I have watched my savings burn for eighteen months. Is that freedom?',
  judge: 'Order. The court will weigh the evidence.',
};
// ─── Pools (your rules) ───
const NEUTRALS = ['neutral1', 'neutral2'];
const POOLS = {
  idle: { all: NEUTRALS },
  confident: { all: ['confident1', 'confident2', ...NEUTRALS] },
  angry: { all: ['confident1', 'confident2', ...NEUTRALS] },          // no angry art yet → confident set
  sweating: { all: ['sweating1', 'sweating2', ...NEUTRALS] },
  shocked: { own: ['shocked1'], weight: 0.7, rest: NEUTRALS },
  breakdown: { own: ['breakdown1'], weight: 0.7, rest: NEUTRALS },
};
const REACTIONS = new Set(['shocked', 'breakdown']);

// ─── Variations ───
const VARIATIONS = [
  { name: 'V1 Ace Attorney', desc: 'Instant cut, head 1.0×, uniform 1–3s ticks.', p: { swap: 'instant', head: 1.0, hx: 0, hy: 0, rhythm: 'uniform', tMin: 1000, tMax: 3000 } },
  { name: 'V2 Pop', desc: 'Cut + 80ms squash pop, head 1.08× sitting deeper in the collar, uniform 1–3s.', p: { swap: 'pop', head: 1.08, hx: 0, hy: 14, rhythm: 'uniform', tMin: 1000, tMax: 3000 } },
  { name: 'V3 Flash', desc: 'Cut + 1-frame white flash, head 0.95× higher, clustered bursts (2–3 quick changes, then a pause).', p: { swap: 'flash', head: 0.95, hx: 0, hy: -12, rhythm: 'clustered', tMin: 1000, tMax: 3000 } },
  { name: 'V4 Smear', desc: 'Cut + 1-frame horizontal smear, head 1.0×, poses change at sentence breaks in the line.', p: { swap: 'smear', head: 1.0, hx: 0, hy: 0, rhythm: 'sentence', tMin: 1000, tMax: 3000 } },
  { name: 'V5 Soft', desc: '60ms crossfade, head 1.04×, narrow 1.5–2.5s ticks.', p: { swap: 'fade', head: 1.04, hx: 0, hy: 6, rhythm: 'uniform', tMin: 1500, tMax: 2500 } },
  { name: '★ Your pick', desc: 'Your tuned values (from V1): instant cut, head 0.85×, per-pose rotations, pedestals, lawyers raised 10px.',
    p: { swap: 'instant', head: 0.85, hx: 0, hy: -28, rhythm: 'uniform', tMin: 950, tMax: 3100, artW: 250, judgeK: 0.66,
         rot: { breakdown1: 45, confident1: -3.5, sweating2: 22 }, sx: 13, sy: -46,
         pedW: 181, pedX: -9, pedY: 126, pedLook: 'natural', inkBottom: true, charY: -10 } },
];
const SLIDERS = [['head', 'Head size ×', 0.6, 1.6, 0.01], ['hx', 'Front head x', -80, 80, 1], ['hy', 'Front head y', -80, 80, 1],
                 ['sx', 'Side head x', -80, 80, 1], ['sy', 'Side head y', -80, 80, 1],
                 ['artW', 'Body width (px)', 150, 380, 2], ['charY', 'Lawyers y (px)', -60, 60, 1], ['judgeK', 'Judge scale ×', 0.4, 1.2, 0.01], ['tMin', 'Tick min ms', 200, 4000, 50], ['tMax', 'Tick max ms', 300, 6000, 50]];
let variation = 0, slow = 1, params = { ...VARIATIONS[0].p, artW: 250, judgeK: 0.72, rot: {}, sx: 0, sy: 0, charY: 0, pedW: 190, pedX: 0, pedY: 58, pedLook: 'natural', inkBottom: false };
const PED_SLIDERS = [['pedW', 'Width (px)', 60, 400, 1], ['pedX', 'X from head', -150, 150, 1], ['pedY', 'Top below face', -60, 200, 1]];
// The Judge sits further back (behind the bench): drawn smaller, like the old 120 vs 160 placeholders.
const widthFor = role => params.artW * (role === 'judge' ? params.judgeK : 1);
const HEAD_ART_W = { prosecution: 270, defense: 270, judge: 250 };   // head width in pose-art px at 1.0×

const $ = id => document.getElementById(id);
const stage = $('stage'), cam = $('cam');
let META, HEAD;
const chars = {};   // role → { el, pose, frame, poseStart, expr, talking, nextTick, ... }

// ─── Pose engine ───
function poolFor(expr) { return POOLS[expr] ?? POOLS.idle; }
function pick(expr, current) {
  const pool = poolFor(expr);
  if (pool.own) {
    const own = pool.own.filter(p => p !== current), rest = pool.rest.filter(p => p !== current);
    const list = own.length && (Math.random() < pool.weight || !rest.length) ? own : rest;
    return list[Math.floor(Math.random() * list.length)] ?? current;
  }
  const list = pool.all.filter(p => p !== current);       // never the same pose twice in a row
  return list[Math.floor(Math.random() * list.length)] ?? current;
}
function nextDelay(c) {
  const r = (a, b) => a + Math.random() * (b - a);
  if (params.rhythm === 'clustered') {
    if (c.burst > 0) { c.burst--; return r(350, 600); }
    if (Math.random() < 0.5) c.burst = 1 + (Math.random() < 0.5 ? 1 : 0);
    return r(Math.max(params.tMin, 1500), params.tMax + 500);
  }
  if (params.rhythm === 'sentence') {
    // ~14 chars/s; the next punctuation mark in the line is the next break.
    const breaks = c.breaks ?? [];
    const t = c.talkMs;
    const nb = breaks.find(b => b > t + 300);
    return nb ? nb - t : r(params.tMin, params.tMax);
  }
  return r(params.tMin, params.tMax);
}
function setPose(role, pose, { swap = true } = {}) {
  const c = chars[role];
  if (c.pose === pose) return;
  const prevSrc = c.img.src;
  c.pose = pose; c.poseStart = performance.now(); c.frame = -1;
  render(role);
  if (swap) swapFx(role, prevSrc);
}
function swapFx(role, prevSrc) {
  const c = chars[role], el = c.el;
  if (params.swap === 'pop') { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  if (params.swap === 'flash') {
    const f = c.flash; f.style.webkitMaskImage = f.style.maskImage = `url(${c.img.src})`;
    f.style.transition = 'none'; f.style.opacity = '1'; requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = `opacity ${40 * slow}ms linear`; f.style.opacity = '0'; }));
  }
  if (params.swap === 'smear') { c.bob.style.filter = 'url(#smear)'; setTimeout(() => (c.bob.style.filter = ''), 34 * slow); }
  if (params.swap === 'fade' && prevSrc) {
    const ghost = c.img.cloneNode(); ghost.src = prevSrc; ghost.classList.add('fading'); c.bob.appendChild(ghost);
    requestAnimationFrame(() => { ghost.style.transitionDuration = `${60 * slow}ms`; ghost.style.opacity = '0'; });
    setTimeout(() => ghost.remove(), 80 * slow);
  }
}
function setExpr(role, expr) {
  const c = chars[role];
  if (c.expr === expr) return;

  $('out').value = JSON.stringify({ variation: VARIATIONS[variation].name, ...params }, null, 1);
  [...$('vars').children].forEach((b, i) => b.classList.toggle('on', i === variation));
  $('vdesc').textContent = VARIATIONS[variation].desc;
}
function setVariation(i) { if (!VARIATIONS[i]) return; variation = i; params = { ...params, ...VARIATIONS[i].p, rot: { ...(VARIATIONS[i].p.rot ?? params.rot) } }; syncPanel(); if (META) { for (const r of Object.keys(chars)) layoutChar(r); layoutPedestals(); layoutPreviews(); edTable(); } }
VARIATIONS.forEach((v, i) => { const b = document.createElement('button'); b.textContent = i < 5 ? 'V' + (i + 1) : '★'; b.title = v.name; b.onclick = () => setVariation(i); $('vars').appendChild(b); });
document.addEventListener('keydown', e => { if (/^Digit[1-6]$/.test(e.code)) setVariation(+e.code.slice(5) - 1); if (e.code === 'KeyD') demo(); if (e.code === 'KeyI') interrupt(!interrupting); });
function fit() { const f = $('fit').getBoundingClientRect(); $('stageBox').style.transform = `scale(${Math.min(f.width / 960, f.height / 540) * 0.96})`; }
addEventListener('resize', fit);

window.__poses = {
  setVariation, demo, interrupt, setExpr, setTalking, whipTo, setCamera: n => setCamera(SHOT[n]),
  show(role, pose, frame = 0) { const c = chars[role]; c.pose = pose; c.poseStart = performance.now() - frame * META.frameMs * slow - 1; c.frame = -1; render(role); },
  state: () => Object.fromEntries(Object.entries(chars).map(([r, c]) => [r, { pose: c.pose, frame: c.frame, expr: c.expr, talking: c.talking, head: roleMeta(r).poses[c.pose].head }])),
};
setVariation(VARIATIONS.length - 1);
build().then(() => { fit(); document.body.dataset.ready = '1'; });
</script>
</body>
